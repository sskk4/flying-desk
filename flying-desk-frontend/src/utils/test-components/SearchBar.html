<script>


document.addEventListener("DOMContentLoaded", function () {
    const filtresBarClose = document.querySelector(".filtres-bar-close");
    const filtresBarOpen = document.querySelector(".filtres-bar-open");
    const arrowShow = document.querySelector(".arrow-show");
    const arrowHide = document.querySelector(".arrow-hide");
    const toggleFiltersButton = document.querySelector(".search-bar-filtres");

    // Ustawia początkowy stan
    filtresBarOpen.style.display = "none";

    // Funkcja do przełączania między sekcjami
    function toggleFilters() {
        if (filtresBarClose.style.display === "none") {
            filtresBarClose.style.display = "flex";
            filtresBarOpen.style.display = "none";
        } else {
            filtresBarClose.style.display = "none";
            filtresBarOpen.style.display = "block";
        }
    }

    // Dodaj nasłuchiwacze zdarzeń do strzałek i przycisku "Filtres"
    arrowShow.addEventListener("click", toggleFilters);
    arrowHide.addEventListener("click", toggleFilters);
    toggleFiltersButton.addEventListener("click", toggleFilters);
});


</script>
