<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Card</title>
    <link rel="stylesheet" href="AdCard.css">
</head>
<body>
    <div class="card">
        <h2>Biuro w centrum Warszawy</h2>
        <hr>
        <p class="location">📍 Warszawa, ul. Mickiewicza 37/58</p>
        <div class="details">
            <div class="detail-item">
                <span>Surface</span>
                <strong>50m</strong>
            </div>
            <div class="detail-item">
                <span>Rooms</span>
                <strong>4</strong>
            </div>
            <div class="detail-item">
                <span>Floor</span>
                <strong>3</strong>
            </div>
            <div class="detail-item">
                <span>Available from</span>
                <strong>27.01.2024</strong>
            </div>
        </div>
        <div class="price-section">
            <p class="price">10,000 PLN/miesiąc</p>
            <p class="note">Rent online is unavailable</p>
            <div class="buttons">
                <button class="rent-btn" disabled>Rent</button>
                <button class="message-btn">Message</button>
            </div>
        </div>
    </div>
</body>
</html>
